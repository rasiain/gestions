services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: laravel-app
    restart: unless-stopped
    ports:
      # Només des d'aquest Mac: amb APP_DEBUG, des de la xarxa es veurien les pàgines d'error
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf
      - /Users/ricardasiain/Documents:/Users/ricardasiain/Documents
      - /Users/ricardasiain/Downloads:/Users/ricardasiain/Downloads
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - IMPORT_SCAN_PATH=/Users/ricardasiain/Downloads
    networks:
      - laravel-network
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: laravel-redis
    restart: unless-stopped
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge
